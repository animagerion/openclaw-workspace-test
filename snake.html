<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 200, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(138, 43, 226, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .game-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }

        .title {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            letter-spacing: 4px;
        }

        .score-display {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .score-display span {
            font-weight: 700;
            font-size: 1.8rem;
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 8px;
            box-shadow: 
                0 0 30px rgba(0, 255, 136, 0.3),
                inset 0 0 60px rgba(0, 255, 136, 0.05);
            background: #0d0d12;
        }

        /* Menu y Game Over Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 15, 0.95);
            border-radius: 8px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .overlay.hidden {
            display: none;
        }

        .menu-title {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00ff88, #00c8ff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.5)); }
            to { filter: drop-shadow(0 0 40px rgba(0, 200, 255, 0.8)); }
        }

        .menu-subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .snake-icon {
            font-size: 4rem;
            margin-bottom: 30px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .final-score {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: #00c8ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .final-score-value {
            font-size: 4rem;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
            margin-bottom: 10px;
        }

        .high-score {
            font-size: 1rem;
            color: #8a2be2;
            margin-bottom: 30px;
        }

        .high-score span {
            color: #ff6b6b;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 280px;
        }

        .stat-item {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            color: #00ff88;
            font-weight: 700;
        }

        .btn {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 15px 40px;
            border: 2px solid #00ff88;
            background: transparent;
            color: #00ff88;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-width: 180px;
            text-align: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover {
            background: #00ff88;
            color: #0a0a0f;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .btn:hover::before {
            left: 100%;
        }

        .controls-hint {
            margin-top: 30px;
            color: #444;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .controls-hint kbd {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 4px;
            padding: 3px 8px;
            margin: 0 3px;
            font-family: 'Orbitron', monospace;
        }

        .game-over-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            color: #ff6b6b;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 10px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid rgba(0, 255, 136, 0.4);
            border-radius: 12px;
            color: #00ff88;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            background: rgba(0, 255, 136, 0.3);
            transform: scale(0.95);
        }

        .control-btn.placeholder {
            visibility: hidden;
        }

        @media (max-width: 600px) {
            .title { font-size: 1.5rem; }
            .score-display { font-size: 1.2rem; }
            .score-display span { font-size: 1.4rem; }
            #gameCanvas {
                width: 320px;
                height: 320px;
            }
            .mobile-controls { display: flex; flex-direction: column; }
            .menu-title { font-size: 2rem; }
        }

        @media (hover: none) and (pointer: coarse) {
            .mobile-controls { display: flex; flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">SNAKE</div>
            <div class="score-display">PTS: <span id="currentScore">0</span></div>
        </div>

        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <!-- Menu Inicial -->
            <div class="overlay" id="menuOverlay">
                <div class="snake-icon">🐍</div>
                <div class="menu-title">SNAKE</div>
                <div class="menu-subtitle">Classic Arcade</div>
                <button class="btn" onclick="startGame()">JUGAR</button>
                <div class="controls-hint">
                    Usa <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> o <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
                </div>
            </div>

            <!-- Game Over -->
            <div class="overlay hidden" id="gameOverOverlay">
                <div class="game-over-title">GAME OVER</div>
                <div class="final-score">Puntuación Final</div>
                <div class="final-score-value" id="finalScore">0</div>
                <div class="high-score">Mejor puntuación: <span id="highScore">0</span></div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">Longitud</div>
                        <div class="stat-value" id="finalLength">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Comida</div>
                        <div class="stat-value" id="finalFood">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Tiempo</div>
                        <div class="stat-value" id="finalTime">0s</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Velocidad</div>
                        <div class="stat-value" id="finalSpeed">1x</div>
                    </div>
                </div>
                <button class="btn" onclick="startGame()">REINTENTAR</button>
                <div class="controls-hint">Presiona <kbd>SPACE</kbd> para reiniciar</div>
            </div>
        </div>

        <!-- Mobile controls -->
        <div class="mobile-controls" id="mobileControls">
            <div class="control-row">
                <button class="control-btn placeholder"></button>
                <button class="control-btn" onclick="setDirection('up')">▲</button>
                <button class="control-btn placeholder"></button>
            </div>
            <div class="control-row">
                <button class="control-btn" onclick="setDirection('left')">◄</button>
                <button class="control-btn" onclick="setDirection('down')">▼</button>
                <button class="control-btn" onclick="setDirection('right')">►</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE;

        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let foodEaten = 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameSpeed = 120;
        let startTime = 0;
        let pauseStartTime = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;

        // Visual effects
        let particles = [];
        let trailParticles = [];

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            foodEaten = 0;
            gameSpeed = 120;
            particles = [];
            trailParticles = [];
            spawnFood();
            updateScore();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                valid = !snake.some(s => s.x === food.x && s.y === food.y);
            }
            // Food spawn particle effect
            createParticles(food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2, '#ff6b6b', 8);
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function update() {
            if (gamePaused) return;

            direction = { ...nextDirection };

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Trail effect
            trailParticles.push({
                x: head.x * CELL_SIZE + CELL_SIZE / 2,
                y: head.y * CELL_SIZE + CELL_SIZE / 2,
                life: 0.5,
                size: CELL_SIZE * 0.8
            });

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                foodEaten++;
                updateScore();
                createParticles(food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2, '#00ff88', 15);
                spawnFood();

                // Speed up every 5 food
                if (foodEaten % 5 === 0 && gameSpeed > 60) {
                    gameSpeed -= 5;
                }
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear with slight fade for trail effect
            ctx.fillStyle = '#0d0d12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pause overlay
            if (gamePaused) {
                ctx.fillStyle = 'rgba(10, 10, 15, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.font = 'bold 36px Orbitron';
                ctx.fillStyle = '#00ff88';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('PAUSA', canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = '14px Rajdhani';
                ctx.fillStyle = '#666';
                ctx.fillText('Pulsa SPACE o una flecha para continuar', canvas.width / 2, canvas.height / 2 + 25);
                return;
            }

            // Draw grid (subtle)
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw trail particles
            trailParticles.forEach((p, i) => {
                ctx.fillStyle = `rgba(0, 255, 136, ${p.life * 0.3})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            trailParticles = trailParticles.filter(p => {
                p.life -= 0.05;
                p.size *= 0.95;
                return p.life > 0;
            });

            // Draw food with glow
            const foodGlow = ctx.createRadialGradient(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                0,
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE
            );
            foodGlow.addColorStop(0, '#ff6b6b');
            foodGlow.addColorStop(0.5, 'rgba(255, 107, 107, 0.5)');
            foodGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = foodGlow;
            ctx.fillRect(food.x * CELL_SIZE - CELL_SIZE / 2, food.y * CELL_SIZE - CELL_SIZE / 2, CELL_SIZE * 2, CELL_SIZE * 2);

            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw snake
            snake.forEach((segment, index) => {
                const gradient = ctx.createRadialGradient(
                    segment.x * CELL_SIZE + CELL_SIZE / 2,
                    segment.y * CELL_SIZE + CELL_SIZE / 2,
                    0,
                    segment.x * CELL_SIZE + CELL_SIZE / 2,
                    segment.y * CELL_SIZE + CELL_SIZE / 2,
                    CELL_SIZE
                );

                if (index === 0) {
                    // Head
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#00c853');
                } else {
                    const alpha = 1 - (index / snake.length) * 0.5;
                    gradient.addColorStop(0, `rgba(0, 255, 136, ${alpha})`);
                    gradient.addColorStop(1, `rgba(0, 180, 100, ${alpha})`);
                }

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2,
                    4
                );
                ctx.fill();

                // Eyes on head
                if (index === 0) {
                    ctx.fillStyle = '#0d0d12';
                    const eyeOffset = 4;
                    const eyeSize = 3;
                    
                    let eye1X = segment.x * CELL_SIZE + CELL_SIZE / 2 - eyeOffset;
                    let eye2X = segment.x * CELL_SIZE + CELL_SIZE / 2 + eyeOffset;
                    let eye1Y = segment.y * CELL_SIZE + CELL_SIZE / 2;
                    let eye2Y = segment.y * CELL_SIZE + CELL_SIZE / 2;

                    if (direction.x === 1) {
                        eye1Y -= 3; eye2Y += 3;
                        eye1X += 5; eye2X += 5;
                    } else if (direction.x === -1) {
                        eye1Y -= 3; eye2Y += 3;
                        eye1X -= 5; eye2X -= 5;
                    } else if (direction.y === 1) {
                        eye1X -= 3; eye2X += 3;
                        eye1Y += 5; eye2Y += 5;
                    } else if (direction.y === -1) {
                        eye1X -= 3; eye2X += 3;
                        eye1Y -= 5; eye2Y -= 5;
                    }

                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw particles
            particles.forEach((p, i) => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.95;
                p.vy *= 0.95;
                p.life -= 0.03;
                return p.life > 0;
            });
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            if (gameRunning) {
                setTimeout(gameLoop, gameSpeed);
            }
        }

        function updateScore() {
            document.getElementById('currentScore').textContent = score;
        }

        function gameOver() {
            gameRunning = false;

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const speedMultiplier = (120 / gameSpeed).toFixed(1);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('finalLength').textContent = snake.length;
            document.getElementById('finalFood').textContent = foodEaten;
            document.getElementById('finalTime').textContent = elapsed + 's';
            document.getElementById('finalSpeed').textContent = speedMultiplier + 'x';

            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        function startGame() {
            document.getElementById('menuOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            initGame();
            gameRunning = true;
            gamePaused = false;
            startTime = Date.now();
            gameLoop();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    gamePaused = !gamePaused;
                }
                return;
            }

            if (!gameRunning || gamePaused) return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    if (gamePaused) gamePaused = false;
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    if (gamePaused) gamePaused = false;
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    if (gamePaused) gamePaused = false;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    if (gamePaused) gamePaused = false;
                    break;
            }
        });

        // Mobile controls
        function setDirection(dir) {
            if (!gameRunning) return;
            if (gamePaused) {
                gamePaused = false;
            }
            switch (dir) {
                case 'up':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'down':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'left':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'right':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        // Initial draw
        initGame();
        draw();
    </script>
</body>
</html>
